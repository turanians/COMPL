<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadece Top ve Işık Simülasyonu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    let scene, camera, renderer, sphere, light, controls;

    function init() {
        // 1. Sahne ve Kamera
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 10);

        // 2. Render Motoru
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 3. Kamera Kontrolü (Fare ile döndürme)
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.target.set(0, 2, 0);
        controls.update();

        // 4. Beyaz Top
        const sphereGeometry = new THREE.SphereGeometry(2, 64, 64);
        const sphereMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.5, 
            metalness: 0.0 
        });
        sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.y = 2;
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        // 5. Zemin (Gölgelerin düşmesi için)
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 6. Yukarıdan Düşen Işık
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.05); // Çok hafif ortam ışığı (zifiri karanlığı önler)
        scene.add(ambientLight);

        light = new THREE.DirectionalLight(0xffffff, 1.5);
        // Işığın konumu: Yukarıda ve hafif açılı
        light.position.set(2, 8, 3);
        light.target = sphere;
        light.castShadow = true;
        light.shadow.mapSize.width = 2048;
        light.shadow.mapSize.height = 2048;
        scene.add(light);

        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    init();
    animate();
</script>
</body>
</html>
